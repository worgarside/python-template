---
name: 'CI: Validation'

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  ci-validation:
    name: 'CI: Validation'
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: worganisation/github-config-files/.github/workflows/__ci-validation.yml@0.11.1
    with:
      build-branch: '${{ github.ref }}'
      build-type: ''
      node-build-directory: ''
      python-version: '3.12'
      unit-test: ''
    secrets: inherit
